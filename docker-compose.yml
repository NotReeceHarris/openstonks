services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: openstonks
      POSTGRES_PASSWORD: openstonks
      POSTGRES_DB: openstonks
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openstonks -d openstonks"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://openstonks:openstonks@db:5432/openstonks?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  db_data:
