services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: openstonks
      POSTGRES_PASSWORD: openstonks
      POSTGRES_DB: openstonks
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openstonks -d openstonks"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  yfinance:
    build:
      context: ./services/yfinance
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://openstonks:openstonks@db:5432/openstonks?sslmode=disable
      YFINANCE_URL: http://yfinance:8080
      LIVE_INTERVAL: 1s
      SYMBOLS: AAPL,MSFT,NVDA,AMZN,GOOGL,META,TSLA,BRK-B,LLY,AVGO,JPM,V,UNH,XOM,MA,COST,HD,PG,WMT,NFLX,BAC,CRM,ORCL,CVX,KO,MRK,PEP,TMO,ACN,ADBE,AMD,WFC,LIN,MCD,ABT,DHR,TXN,PM,ISRG,CAT,GE,INTU,IBM,AXP,SPGI,BKNG,GS,RTX,AMGN,QCOM,T,VZ,LOW,SYK,BLK,PLD,AMAT,GILD,MDLZ,ADI,REGN,VRTX,NOW,CI,TJX,LRCX,BSX,MU,ETN,DE,SLB,PANW,CB,ADP,SCHW,ZTS,UPS,SO,CME,C,BMY,DUK,CL,EOG,ITW,WM,ICE,NOC,USB,MCO,APH,HCA,TT,PH,GD,EMR,AON,EQIX,BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,USDCUSDT,ADAUSDT,AVAXUSDT,DOGEUSDT,TRXUSDT
      POLYGON_API_KEY: ${POLYGON_API_KEY}
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      yfinance:
        condition: service_healthy
    restart: on-failure

volumes:
  db_data:
